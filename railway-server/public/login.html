<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDoc — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0d0d0d; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 380px; }
    .login-card h1 { font-family: 'Crimson Pro', serif; font-size: 1.6rem; color: #CFAFE7; margin-bottom: 0.5rem; }
    .login-card p { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-group input { width: 100%; padding: 0.7rem 0.9rem; background: #0d0d0d; border: 1px solid #333; border-radius: 6px; color: #e0e0e0; font-size: 0.9rem; font-family: 'Inter', sans-serif; }
    .form-group input:focus { outline: none; border-color: #CFAFE7; }
    .login-btn { width: 100%; padding: 0.7rem; background: #CFAFE7; color: #0d0d0d; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background 0.2s; font-family: 'Inter', sans-serif; }
    .login-btn:hover { background: #b89ad1; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg { color: #f87171; font-size: 0.82rem; margin-top: 1rem; display: none; }
    .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #888; font-size: 0.82rem; text-decoration: none; }
    .back-link:hover { color: #CFAFE7; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>SmartDoc</h1>
    <p>Connexion à l'espace privé</p>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="login-btn" id="submit-btn">Se connecter</button>
      <p class="error-msg" id="error-msg"></p>
    </form>
    <a href="/" class="back-link">← Retour à la cartographie</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect') || '/dashboard';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errMsg = document.getElementById('error-msg');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Connexion…';
      errMsg.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Erreur de connexion');
        }

        window.location.href = redirect;
      } catch (err) {
        errMsg.textContent = err.message;
        errMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
